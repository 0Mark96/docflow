<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DocFlow Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: white app shell. Tinted sidebar + sticky top bar with global search; content left-aligned at 1140px.
   Signature: provenance. Every extracted value shows where it came from
   (XML = solid green line, AI = dotted amber, corrected/verified = blue). */
:root{
  --bg:#ffffff; --panel:#f6f7fa; --side:#f8f9fc; --line:#e6e8ee; --line-2:#d4d8e1;
  --fg:#141821; --muted:#5f6675; --faint:#8a909c;
  --accent:#2745c7; --accent-hover:#1e39ab; --accent-ink:#ffffff; --accent-soft:#edf0fc; --accent-line:#c9d2f6;
  --ok:#147447; --ok-soft:#e8f5ee; --ai:#a05600; --ai-soft:#fdf2e1; --err:#bd2618;
  --err-soft:#fdeceb; --note-bg:#fffaea; --note-line:#eed688; --note-fg:#594700;
  --m1:#e8eefc; --m1f:#2c4bb8; --m2:#e7f4ee; --m2f:#18704a; --m3:#fbeee4; --m3f:#9a4a12;
  --m4:#f1eafb; --m4f:#6a3bb0; --m5:#e6f3f6; --m5f:#16667a; --m6:#fbe9ee; --m6f:#a32a4f;
  --shadow:0 1px 2px rgba(20,24,33,.06),0 4px 14px rgba(20,24,33,.06);
  --shadow-lg:0 12px 40px rgba(20,24,33,.18);
  --f:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-sm:6px; --r:10px; --r-lg:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16.5px;padding:2px 8px;letter-spacing:-.015em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);position:relative;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.logo::before{content:"";position:absolute;left:8px;top:6px;width:11px;height:15px;border-radius:2px 5px 2px 2px;background:#fff}
.logo::after{content:"";position:absolute;left:10.5px;top:12px;width:6px;height:2px;background:var(--accent);box-shadow:0 3.5px 0 var(--accent)}
.newbtn{justify-content:center}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:#eef0f5;color:var(--fg)}
.nav a[aria-current="page"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(20,24,33,.08),0 0 0 1px var(--line)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--ai-soft);color:var(--ai);border-radius:999px;padding:0 7px}
.navlabel{font-size:12px;color:var(--faint);padding:0 10px 4px}
.usage{margin-top:auto;display:grid;gap:6px;padding:12px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);font-size:12.5px;color:var(--muted)}
.usage .bar{height:5px;border-radius:9px;background:var(--panel);overflow:hidden}
.usage .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.company{display:flex;gap:10px;align-items:center;padding:4px 6px;font-size:13px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.company b{display:block;color:var(--fg);font-weight:500;line-height:1.3}
.company .link{margin-left:auto}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-block:11px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.searchwrap{position:relative;flex:1;max-width:460px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:6px 10px;color:var(--faint);transition:border-color .15s,background .15s}
.search:focus-within{border-color:var(--accent-line);background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:16px;height:16px;flex:none}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--fg)}
kbd{font:inherit;font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--bg)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;display:grid;gap:2px;z-index:8}
.results .grp{font-size:12px;color:var(--faint);padding:6px 8px 2px}
.results a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-sm);color:var(--fg);text-decoration:none}
.results a[aria-selected="true"],.results a:hover{background:var(--accent-soft)}
.results small{color:var(--faint);margin-left:auto;white-space:nowrap}
.results .empty{padding:10px;color:var(--muted);font-size:13px}
.top .spacer{flex:1}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.switch input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;margin:0;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(20,24,33,.25);transition:transform .15s}
.switch input:checked{background:#e0bd45}
.switch input:checked::after{transform:translateX(12px)}

.content{padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1140px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
h1{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
.sub{color:var(--muted);margin:3px 0 0}
.crumb{font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.crumb:hover{color:var(--fg)}

.note{border-left:3px solid var(--note-line);background:var(--note-bg);color:var(--note-fg);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 14px;font-size:13px;line-height:1.55}
.note strong{font-weight:600}
body.nonotes .note{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--bg);padding:7px 13px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;white-space:nowrap;box-shadow:0 1px 0 rgba(20,24,33,.04);text-decoration:none;color:var(--fg);transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:inset 0 -1px 0 rgba(0,0,0,.15)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.danger:hover{background:#a01f13}
.btn.ghost{border-color:transparent;box-shadow:none;background:none}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn svg{width:15px;height:15px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13px;font-weight:500}
.link:hover{text-decoration:underline}
.iconbtn{border:0;background:none;color:var(--faint);cursor:pointer;padding:5px;border-radius:6px;display:inline-grid;place-items:center}
.iconbtn:hover{color:var(--fg);background:var(--panel)}
.iconbtn.del:hover{color:var(--err);background:var(--err-soft)}
.iconbtn svg{width:16px;height:16px}

/* states */
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;font-weight:500}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok)} .s-proc{color:var(--accent)} .s-err{color:var(--err)}
.s-proc i{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.ftype{display:inline-grid;place-items:center;width:32px;height:38px;border:1px solid var(--line-2);border-radius:4px 9px 4px 4px;font-size:9px;font-weight:700;letter-spacing:.02em;color:var(--muted);flex:none;background:var(--bg)}
.ftype.xml{color:var(--ok);border-color:#bfe3cf;background:#f6fbf8}
.ftype.pdf{color:var(--err);border-color:#f2c9c4;background:#fef8f7}
.mono-av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.fname{display:flex;align-items:center;gap:12px;min-width:0}
.fname>div{min-width:0}
.fname a,.fname .n{font-weight:500;color:var(--fg);text-decoration:none;word-break:break-word}
.fname a:hover{color:var(--accent)}
.fname small{display:block;color:var(--faint);font-size:12.5px}
.errline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--err);margin-top:2px}
.progress{height:3px;border-radius:9px;background:var(--accent-soft);overflow:hidden;width:120px;margin-top:6px}
.progress i{display:block;height:100%;width:40%;background:var(--accent);border-radius:9px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* provenance: the signature detail */
.prov{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.prov::before{content:"";width:14px;height:0;border-top:2px solid var(--ok);flex:none}
.prov.ai::before{border-top:2px dotted var(--ai)}
.prov.low{color:var(--ai);font-weight:500}
.prov.fixed::before{border-top-color:var(--accent)}
.v-ai{text-decoration:underline dotted var(--ai) 2px;text-underline-offset:4px}
.v-low{background:var(--ai-soft);border-radius:3px;padding:0 3px}

/* todo strip */
.todo{display:flex;flex-wrap:wrap;gap:10px}
.todo button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(20,24,33,.04);transition:border-color .12s,box-shadow .12s;flex:1 1 220px}
.todo button:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.todo .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600;font-size:13px}
.todo .t-ai .dot{background:var(--ai-soft);color:var(--ai)}
.todo .t-err .dot{background:var(--err-soft);color:var(--err)}
.todo .t-due .dot{background:var(--accent-soft);color:var(--accent)}
.todo b{display:block;font-weight:500;font-size:14px}
.todo small{color:var(--muted);font-size:12.5px}
.todo .go{margin-left:auto;color:var(--faint)}
.todo .go svg{width:16px;height:16px}
.alldone{display:flex;gap:10px;align-items:center;color:var(--ok);font-weight:500;font-size:14px;padding:4px 2px}

/* upload */
.upload{display:flex;align-items:center;gap:16px;border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:18px 20px;cursor:pointer;transition:border-color .15s,background .15s;background:linear-gradient(var(--bg),var(--bg)) padding-box}
.upload:hover,.upload.over{border-color:var(--accent);background:var(--accent-soft)}
.upload.over{border-style:solid}
.upload .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;transition:transform .2s}
.upload.over .ic{transform:translateY(-3px)}
.upload .ic svg{width:21px;height:21px}
.upload>div{min-width:0}
.upload small{color:var(--muted);display:block}
.upload .btn{margin-left:auto}

/* panels + tables */
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg);min-width:0;box-shadow:0 1px 2px rgba(20,24,33,.04)}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h .spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--panel);border-radius:8px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:4px 11px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tabs button span{font-size:11.5px;color:var(--faint)}
.tabs button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(20,24,33,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ai-soft);border-color:#efcf9c;color:var(--ai)}
.chip b{font-weight:600}
.input{border:1px solid var(--line-2);background:var(--bg);border-radius:var(--r-sm);padding:6px 10px;min-width:0}
.input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:500;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
th:first-child{border-top-left-radius:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--fg)}
th button[data-dir]{color:var(--fg)}
th button[data-dir]::after{content:"↑";font-size:11px}
th button[data-dir="-1"]::after{content:"↓"}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s}
tbody tr:hover td{background:#fafbfd}
tbody tr.sel td{background:var(--accent-soft)}
tbody tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
.r{text-align:right}
.cbx{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
td.cb,th.cb{width:36px;padding-right:0}
td a.plain{color:var(--fg);text-decoration:none;font-weight:500}
td a.plain:hover{color:var(--accent)}
.sup{display:flex;align-items:center;gap:10px}
.due-soon{color:var(--err);font-weight:500}
.due-soon small{display:block;font-size:11.5px;font-weight:500}
.rowact{display:flex;gap:2px;justify-content:flex-end;opacity:.55;transition:opacity .12s}
tr:hover .rowact,tr:focus-within .rowact{opacity:1}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.emptystate{padding:44px 16px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.emptystate .ic{width:46px;height:46px;border-radius:14px;background:var(--panel);display:grid;place-items:center;color:var(--faint)}
.emptystate .ic svg{width:22px;height:22px}
.emptystate b{color:var(--fg);font-weight:600}

/* custom select */
.sel{position:relative;display:inline-block}
.form .sel{display:block}
.sel-btn{display:flex;align-items:center;gap:10px;justify-content:space-between;width:100%;min-width:160px;border:1px solid var(--line-2);background:var(--bg);border-radius:var(--r-sm);padding:6px 10px;cursor:pointer;text-align:left;font-weight:500;transition:border-color .12s,background .12s}
.form .sel-btn{padding:8px 10px}
.sel-btn:hover{border-color:#b6bcc8}
.sel-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel-btn svg{width:15px;height:15px;color:var(--faint);flex:none;transition:transform .15s}
.sel-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.sel.on .sel-btn{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.sel.on .sel-btn svg{color:var(--accent)}
.sel-list{position:absolute;top:calc(100% + 5px);left:0;min-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:4px;margin:0;list-style:none;z-index:45;animation:drop .12s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}}
.sel-list li{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;font-size:14px}
.sel-list li.act{background:var(--panel)}
.sel-list li[aria-selected="true"]{color:var(--accent);font-weight:500}
.sel-list li .ck{width:15px;height:15px;flex:none;visibility:hidden}
.sel-list li[aria-selected="true"] .ck{visibility:visible}
.sel-list li small{color:var(--faint);margin-left:auto;padding-left:16px;font-weight:400}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center;padding-block:18px 8px}
.display{font-size:clamp(30px,3.9vw,46px);line-height:1.08;letter-spacing:-.035em;font-weight:600;max-width:15ch}
.lede{font-size:17px;line-height:1.6;color:var(--muted);margin:18px 0 0;max-width:46ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn.lg{padding:10px 18px;font-size:15px}
.hero-meta{font-size:13.5px;color:var(--faint);margin:16px 0 0}
.stage{margin:0;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 26px 18px;display:grid;gap:14px}
.stage-sheet{background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 22px 6px;font-size:13px;line-height:1.75;color:#454b57;transform:rotate(-1deg);margin-right:28px}
.stage-sheet p{margin:0 0 10px}
.stage-sheet b{color:var(--fg);font-weight:600}
.ss-h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.ss-kind{font-size:9px;font-weight:700;color:var(--err);border:1px solid #f2c9c4;border-radius:3px;padding:0 4px}
.stage-sheet mark{color:inherit;background:linear-gradient(var(--ai-soft),var(--ai-soft)) no-repeat 0 0/0% 100%;border-radius:2px;padding:0 2px;transition:background-size .45s ease;text-decoration:underline dotted transparent 2px;text-underline-offset:4px}
.stage-sheet mark.on{background-size:100% 100%;text-decoration-color:var(--ai);color:var(--fg)}
.stage-row{background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:10px 16px;margin:-34px -10px 0 18px;position:relative}
.sr-cell{min-width:0}
.sr-cell small{display:block;font-size:11.5px;color:var(--faint)}

function addFiles(files){
 const ok=[],bad=[];
 for(const f of files){
  const ext=f.name.split(".").pop().toLowerCase();
  const kind=ext==="xml"?"fatturapa":ext==="pdf"?"pdf":ext==="txt"?"text":null;
  if(!kind){bad.push(`${f.name}: formato non supportato (usa PDF, TXT o XML)`);continue}
  if(f.size>10*1024*1024){bad.push(`${f.name}: supera i 10 MB`);continue}
  if(DOCS.some(d=>d.name===f.name)){bad.push(`${f.name}: è già caricato`);continue}
  ok.push({name:f.name,kind,size:Math.max(1,Math.round(f.size/1024))});
 }
 ok.forEach(f=>{
  const id=++S.uid; DOCS.unshift({id,...f,status:"processing",date:"2026-11-06",fresh:true});
  log("upload","ha caricato",f.name);
  setTimeout(()=>{const d=byId(id);if(!d)return;
   const base=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ");
   Object.assign(d,{status:"ready",supplier:base.replace(/\b\w/g,c=>c.toUpperCase()).slice(0,28),type:/fattur/i.test(base)||f.kind==="fatturapa"?"Fattura":/contratt/i.test(base)?"Contratto":"Preventivo",amount:Math.round(500+Math.random()*4000)+.5,due:"2026-12-"+String(10+Math.floor(Math.random()*18)),source:f.kind==="fatturapa"?"parser":"ai",conf:f.kind==="fatturapa"?undefined:.74+Math.random()*.2});
   render(); toast(`${esc(f.name)} è pronto`,{label:"Apri",run:()=>location.hash="doc-"+id});
  },2500+Math.random()*1500);
 });
 render();
 if(bad.length) openOverlay(`<div class="warnic">${I.warn}</div><h2>${bad.length===1?"Un file non è stato caricato":bad.length+" file non sono stati caricati"}</h2><p>${bad.map(esc).join("<br>")}</p>${ok.length?`<p>Gli altri ${ok.length} sono in elaborazione.</p>`:""}<div class="actions"><button class="btn primary" data-close>Ho capito</button></div>`);
 else if(ok.length) toast(ok.length===1?`${esc(ok[0].name)} caricato. Lo sto elaborando.`:`${ok.length} file caricati. Li sto elaborando.`);
}

function todoStrip(){
 const rev=DOCS.filter(needsReview), fail=DOCS.filter(d=>d.status==="failed"), soon=ready().filter(d=>days(d.due)>=0&&days(d.due)<=10);
 const items=[];
 if(rev.length) items.push(`<button class="t-ai" data-go="review"><span class="dot">${rev.length}</span><span><b>${rev.length===1?"Un valore da verificare":rev.length+" documenti da verificare"}</b><small>Estratti dall'AI con confidenza bassa</small></span><span class="go">${I.chev}</span></button>`);
 if(fail.length) items.push(`<button class="t-err" data-go="err"><span class="dot">${fail.length}</span><span><b>${fail.length===1?"Un file non elaborato":fail.length+" file non elaborati"}</b><small>Riprova o caricane una versione migliore</small></span><span class="go">${I.chev}</span></button>`);
 if(soon.length) items.push(`<button class="t-due" data-go="soon"><span class="dot">${soon.length}</span><span><b>${soon.length===1?"Una scadenza":soon.length+" scadenze"} nei prossimi 10 giorni</b><small>${soon.map(d=>esc(d.supplier.split(" ")[0])).join(", ")}</small></span><span class="go">${I.chev}</span></button>`);
 return items.length?`<div class="todo" aria-label="Da fare">${items.join("")}</div>`:`<div class="alldone">${I.check} Tutto in ordine: niente da verificare e nessun file con errori.</div>`;
}

V.documenti=()=>{
 const counts={"":DOCS.length,fatturapa:DOCS.filter(d=>d.kind==="fatturapa").length,pdf:DOCS.filter(d=>d.kind==="pdf").length,text:DOCS.filter(d=>d.kind==="text").length,err:DOCS.filter(d=>d.status==="failed").length};
 const list=DOCS.filter(d=>!S.docTab||(S.docTab==="err"?d.status==="failed":d.kind===S.docTab));
 const soon=ready().filter(d=>days(d.due)>=0&&days(d.due)<=30).sort((a,b)=>a.due<b.due?-1:1);
 const tab=(v,t)=>`<button data-tab="${v}" aria-pressed="${S.docTab===v}">${t}<span>${counts[v]}</span></button>`;
 const allSel=list.length&&list.every(d=>S.sel.has(d.id));
 const rows=list.map(d=>`<tr class="${S.sel.has(d.id)?"sel":""} ${d.fresh||S.backTo===d.id?"flash":""}">
   <td class="cb"><input type="checkbox" class="cbx" data-sel="${d.id}" ${S.sel.has(d.id)?"checked":""} aria-label="Seleziona ${esc(d.name)}"></td>
   <td><div class="fname"><span class="ftype ${KIND[d.kind].c}">${KIND[d.kind].t}</span><div>${d.status==="ready"?`<a href="#doc-${d.id}">${esc(d.name)}</a><small>${esc(d.supplier)}, ${size(d.size)}</small>`:`<span class="n">${esc(d.name)}</span><small>${size(d.size)}</small>`}
   ${d.status==="processing"?`<div class="progress"><i></i></div>`:""}${d.error?`<span class="errline">${esc(d.error)} <button class="link" data-retry="${d.id}">Riprova</button></span>`:""}</div></div></td>
   <td class="num">${itDate(d.date)}</td><td>${STATUS[d.status]}</td>
   <td><div class="rowact">${d.status==="ready"?`<a class="iconbtn" href="#doc-${d.id}" title="Apri" aria-label="Apri ${esc(d.name)}">${I.eye}</a><button class="iconbtn" data-dl="${d.id}" title="Scarica" aria-label="Scarica ${esc(d.name)}">${I.dl}</button>`:""}${d.status==="failed"?`<button class="iconbtn" data-retry="${d.id}" title="Riprova" aria-label="Riprova ${esc(d.name)}">${I.retry}</button>`:""}<button class="iconbtn del" data-del="${d.id}" title="Elimina" aria-label="Elimina ${esc(d.name)}">${I.trash}</button></div></td></tr>`).join("");
 DOCS.forEach(d=>delete d.fresh);
 return shell("documenti",`
 <div class="head"><div><h1>File caricati</h1><p class="sub">I file di Officina Esempio S.r.l. e il loro stato di lettura. Fornitori, importi e scadenze li trovi in <a href="#dati">Tabella dati</a>.</p></div></div>
 ${todoStrip()}
 <div class="upload" id="drop" role="button" tabindex="0" aria-label="Carica documenti"><div class="ic">${I.up}</div><div><b>Trascina qui i file da caricare</b><small>PDF, TXT o fattura elettronica XML, fino a 10 MB ciascuno. Puoi caricarne più di uno insieme.</small></div><span class="btn primary">Scegli file</span></div>
 ${note("I file vanno nello Storage privato dell'azienda (M2). Le fatture XML vengono lette senza AI, PDF e TXT con l'AI (M3). Il selettore file è vero: scegli file dal tuo computer (non vengono caricati da nessuna parte) e vedrai i controlli su formato, dimensione e duplicati. Oppure trascina qui qualsiasi cosa per una demo.")}
 <div class="split">
  <section class="panel" aria-label="Elenco documenti"><div class="panel-h"><div class="tabs" role="group" aria-label="Filtra per tipo">${tab("","Tutti")}${tab("fatturapa","Fatture XML")}${tab("pdf","PDF")}${tab("text","Testo")}${counts.err?tab("err","Con errori"):""}</div></div>
  ${list.length?`<div class="tablebox"><table><thead><tr><th class="cb"><input type="checkbox" class="cbx" id="selAll" ${allSel?"checked":""} aria-label="Seleziona tutti"></th><th>Documento</th><th>Caricato il</th><th>Stato</th><th><span class="sr">Azioni</span></th></tr></thead><tbody>${rows}</tbody></table></div>`
  :`<div class="emptystate"><div class="ic">${I.docs}</div><b>${DOCS.length?"Nessun documento in questa vista":"Non hai ancora caricato documenti"}</b><span>${DOCS.length?"Prova un altro filtro.":"Carica la prima fattura o il primo contratto per iniziare."}</span>${DOCS.length?`<button class="btn" data-tab="">Mostra tutti</button>`:`<button class="btn primary" data-upload>${I.up}Carica documenti</button>`}</div>`}
  </section>
  <aside class="panel upcoming" aria-label="In scadenza"><h2>In scadenza nei prossimi 30 giorni</h2>
   ${soon.length?`<ol>${soon.map(d=>{const [y,m,g]=d.due.split("-"),n=days(d.due);return `<li><a href="#doc-${d.id}"><div class="cal ${n<=10?"soon":""}"><span>${MON[+m-1]}</span><b>${+g}</b></div><span class="who">${esc(d.supplier)}<small>${d.type}, ${n===0?"oggi":n===1?"domani":"tra "+n+" giorni"}</small></span><span class="num" style="font-weight:500">${eur(d.amount)}</span></a></li>`}).join("")}</ol>
   <div class="sum"><span>Totale</span><b class="num">${eur(soon.reduce((s,d)=>s+d.amount,0))}</b></div>`:`<p class="sub">Nessuna scadenza nei prossimi 30 giorni.</p>`}
  </aside>
 </div>
 ${S.sel.size?`<div class="bulk" role="region" aria-label="Azioni sui selezionati"><span><b>${S.sel.size}</b> ${S.sel.size===1?"selezionato":"selezionati"}</span><button class="btn sm" id="bulkDl">${I.dl}Scarica</button><button class="btn sm danger" id="bulkDel">${I.trash}Elimina</button><button class="btn sm ghost" id="bulkClear" style="color:#fff" aria-label="Deseleziona">${I.x}</button></div>`:""}`)};

function dataRows(){
 const f=(document.getElementById("q")||{}).value||"", t=(document.getElementById("ftype")||{}).value||"", s=(document.getElementById("fsrc")||{}).value||"";
 let rows=ready().filter(d=>(!f||d.supplier.toLowerCase().includes(f.toLowerCase()))&&(!t||d.type===t)&&(!s||d.source===s)&&(!S.onlyReview||needsReview(d)));
 rows.sort((a,b)=>(a[S.sortKey]>b[S.sortKey]?1:a[S.sortKey]<b[S.sortKey]?-1:0)*S.sortDir);
 return rows;
}
function dataBody(){
 const rows=dataRows();
 document.querySelectorAll("[data-sort]").forEach(b=>{if(b.dataset.sort===S.sortKey)b.dataset.dir=S.sortDir;else delete b.dataset.dir;b.closest("th").setAttribute("aria-sort",b.dataset.sort===S.sortKey?(S.sortDir>0?"ascending":"descending"):"none")});
 const tot=document.getElementById("tot"); if(tot) tot.textContent=`${rows.length} ${rows.length===1?"documento":"documenti"}, totale ${eur(rows.reduce((s,d)=>s+d.amount,0))}`;
 const rc=document.getElementById("revchip"); if(rc){const n=ready().filter(needsReview).length;rc.hidden=!n&&!S.onlyReview;rc.querySelector("b").textContent=n;rc.setAttribute("aria-pressed",S.onlyReview)}
 if(!rows.length) return `<tr><td colspan="6"><div class="emptystate"><div class="ic">${S.onlyReview?I.check:I.search}</div><b>${S.onlyReview?"Hai verificato tutto":"Nessun documento corrisponde ai filtri"}</b><button class="btn" id="clearF">Togli i filtri</button></div></td></tr>`;
 return rows.map(d=>{const dd=days(d.due);return `<tr class="${S.backTo===d.id?"flash":""}">
  <td><div class="sup">${mono(d.supplier)}<a class="plain" href="#doc-${d.id}">${esc(d.supplier)}</a></div></td><td>${d.type}</td>
  <td class="r num"><span class="${valCls(d)}">${eur(d.amount)}</span></td>
  <td class="num ${dd>=0&&dd<=10?"due-soon":""}">${itDate(d.due)}${dd>=0&&dd<=10?`<small>tra ${dd} giorni</small>`:""}</td>
  <td>${prov(d)}</td>
  <td><div class="rowact">${needsReview(d)?`<button class="btn sm" data-verify="${d.id}" title="Ho controllato: i valori sono giusti">${I.check}Verifica</button>`:""}<button class="iconbtn" data-edit="${d.id}" title="Correggi i dati" aria-label="Correggi i dati di ${esc(d.supplier)}">${I.pen}</button></div></td></tr>`}).join("");
}

 if(m.q) return `<div class="q">${esc(m.q)}</div>`;
 if(m.typing) return `<div class="a"><div class="who" aria-hidden="true"></div><div class="body"><span class="typing" aria-label="Sto cercando nei documenti"><i></i><i></i><i></i></span></div></div>`;
 const cites=(m.c||[]).map(([id,l,x])=>byId(id)?`<a class="cite" href="#doc-${id}">${I.file}${esc(l)}${x?` <em>${x}</em>`:""}</a>`:`<span class="cite" style="color:var(--faint)" title="Documento eliminato">${I.file}${esc(l)} <em>eliminato</em></span>`).join("");
 return `<div class="a ${m.nf?"nf":""}"><div class="who" aria-hidden="true"></div><div class="body">${m.nf?`<span class="nfflag">Non trovato nei tuoi documenti</span>`:""}<p>${m.a}</p>${cites?`<div class="cites">${cites}</div>`:""}
  <div class="msgtools"><button class="iconbtn" data-copy="${i}" title="Copia risposta" aria-label="Copia risposta">${I.copy}</button><button class="iconbtn" data-fb="${i}:up" aria-pressed="${m.fb==="up"}" title="Risposta utile" aria-label="Risposta utile">${I.up1}</button><button class="iconbtn" data-fb="${i}:down" aria-pressed="${m.fb==="down"}" title="Risposta sbagliata" aria-label="Risposta sbagliata">${I.down1}</button></div></div></div>`;
}

function playStage(){
 const st=document.querySelector(".stage"); if(!st) return;
 clearTimeout(playStage.t); st.querySelectorAll("[data-s]").forEach(e=>e.classList.remove("on"));
 const cap=document.getElementById("stageCap");
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 if(reduce){st.querySelectorAll("[data-s]").forEach(e=>e.classList.add("on"));cap.textContent="Così DocFlow legge un contratto.";return}
 cap.textContent="DocFlow sta leggendo il contratto…";
 let i=1;
 const step=()=>{
  if(!document.contains(st)) return;
  st.querySelectorAll(`[data-s="${i}"]`).forEach(e=>e.classList.add("on"));
  if(i<5){i++;playStage.t=setTimeout(step,i===2?650:800)}
  else cap.textContent="Fatto: 4 dati trovati in 3 secondi, ognuno con la sua frase.";
 };
 playStage.t=setTimeout(step,500);
}

 const tab=(v,t)=>`<button data-log="${v}" aria-pressed="${S.logFilter===v}">${t}</button>`;
 return shell("attivita",`
 <div class="head"><div><h1>Attività</h1><p class="sub">Chi ha caricato, corretto, esportato o eliminato cosa. Non si può modificare.</p></div></div>

 ${list.length?`<ol class="timeline">${list.map(l=>`<li><span class="ev ${l.type}">${EV[l.type]}</span><span class="what"><b style="font-weight:500">${esc(l.who)}</b> <span>${esc(l.text)}</span> ${esc(l.target)}</span><small class="num">${relTime(l.t)}</small></li>`).join("")}</ol>`:`<div class="emptystate"><div class="ic">${I.clock}</div><b>Nessuna attività di questo tipo</b></div>`}
 </section>`)};

 const text=xml?`<code>&lt;CedentePrestatore&gt;

&lt;/CedentePrestatore&gt;

&lt;/DatiGeneraliDocumento&gt;
&lt;DatiPagamento&gt;
  &lt;DataScadenzaPagamento&gt;<mark data-k="due">${d.due}</mark>&lt;/DataScadenzaPagamento&gt;
  &lt;ImportoPagamento&gt;<mark data-k="amount">${d.amount.toFixed(2)}</mark>&lt;/ImportoPagamento&gt;
&lt;/DatiPagamento&gt;</code>`:`<span class="h"><mark data-k="type">${d.type.toUpperCase()}</mark> N. 2026/031</span>

Tra Officina Esempio S.r.l., Via Garibaldi 8, Bergamo, e <mark data-k="supplier">${esc(d.supplier)}</mark>, con sede in Via Roma 12, Milano.

<span class="h">Art. 3. Corrispettivo</span>
Il corrispettivo complessivo è fissato in <mark data-k="amount">${eur(d.amount)}</mark> oltre IVA, da corrispondere in due rate a 30 e 60 giorni.

<span class="h">Art. 4. Durata</span>
Il presente accordo ha validità fino al <mark data-k="due">${itDate(d.due)}</mark> e non si rinnova tacitamente.`;
 const dd=days(d.due);
 return shell("documenti",`
 <div><a class="crumb" href="#${S.from}" id="backlink">${I.back}${({home:"Home",documenti:"File caricati",dati:"Tabella dati",domande:"Domande",attivita:"Attività"})[S.from]||"File caricati"}</a></div>
 <div class="head"><div class="fname" style="gap:14px"><span class="ftype ${KIND[d.kind].c}">${KIND[d.kind].t}</span><div><h1>${esc(d.name)}</h1><p class="sub" style="margin:0">${KIND[d.kind].l}, ${size(d.size)}, caricato il ${itDate(d.date)}</p></div></div>
  <div class="actions"><button class="btn" data-dl="${d.id}">${I.dl}Scarica</button>${d.source==="ai"?`<button class="btn" id="reext">${I.retry}Rileggi con l'AI</button>`:""}<button class="btn" data-del="${d.id}" style="color:var(--err)">${I.trash}Elimina</button></div></div>
 <div class="detail">
  <div class="paper"><div class="sheet ${xml?"":"ai"}" aria-label="Testo del documento">${text}</div></div>
  <section class="panel fields"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2>Dati letti dal documento</h2>${prov(d)}</div>
   <dl class="kv"><dt>Fornitore</dt><dd data-hl="supplier">${esc(d.supplier)}</dd><dt>Tipo</dt><dd data-hl="type">${d.type}</dd><dt>Importo</dt><dd class="num" data-hl="amount"><span class="${valCls(d)}">${eur(d.amount)}</span></dd><dt>${d.type==="Preventivo"?"Valido fino al":"Scadenza"}</dt><dd class="num" data-hl="due">${itDate(d.due)}${dd>=0&&dd<=30?` <span style="color:${dd<=10?"var(--err)":"var(--muted)"};font-weight:400">tra ${dd} giorni</span>`:""}</dd></dl>
   <div class="actions">${needsReview(d)?`<button class="btn primary" data-verify="${d.id}">${I.check}Sono giusti</button>`:""}<button class="btn" data-edit="${d.id}">${I.pen}Correggi</button><a class="btn ghost" href="#domande" id="askAbout">${I.chat}Chiedi su questo documento</a></div>
   <p class="hint">${xml?"Valori letti direttamente dalla fattura elettronica: nessuna AI coinvolta.":"Valori estratti dall'AI. Passa il mouse su un campo per vedere nel documento da dove è stato preso."}</p>
  </section></div>
 ${note("È anche la pagina a cui portano le citazioni della chat. Passando il mouse su un campo a destra si evidenzia il punto del documento da cui arriva (M3).")}
`)};
V.gone=()=>shell("documenti",`<div class="emptystate"><div class="ic">${I.docs}</div><b>Questo documento non esiste più</b><span>Potrebbe essere stato eliminato. Lo trovi in Attività.</span><a class="btn" href="#documenti">Torna a File caricati</a></div>`);

/* ---------- ricerca globale ---------- */
let resIdx=0;
function searchResults(q){
 q=q.trim().toLowerCase(); if(!q) return null;
 const docs=DOCS.filter(d=>d.name.toLowerCase().includes(q)||(d.supplier||"").toLowerCase().includes(q)).slice(0,6);
 const sups=[...new Set(ready().map(d=>d.supplier).filter(s=>s.toLowerCase().includes(q)))].slice(0,3);
 return {docs,sups,q};
}
function drawResults(){
 const inp=document.getElementById("gsearch"), box=document.getElementById("results"), r=searchResults(inp.value);
 if(!r){box.hidden=true;inp.setAttribute("aria-expanded","false");return}
 let html="",n=0;
 if(r.docs.length) html+=`<div class="grp">File caricati</div>`+r.docs.map(d=>`<a href="${d.status==="ready"?"#doc-"+d.id:"#documenti"}" role="option" aria-selected="${n++===resIdx}"><span class="ftype ${KIND[d.kind].c}" style="width:24px;height:28px;font-size:8px">${KIND[d.kind].t}</span>${esc(d.name)}<small>${d.status==="ready"?esc(d.supplier):STATUS[d.status]}</small></a>`).join("");
 if(r.sups.length) html+=`<div class="grp">Fornitori in Tabella dati</div>`+r.sups.map(s=>`<a href="#dati" data-sup="${esc(s)}" role="option" aria-selected="${n++===resIdx}">${mono(s)}${esc(s)}</a>`).join("");
 html+=`<div class="grp">Chiedi all'AI</div><a href="#domande" data-askq="${esc(inp.value)}" role="option" aria-selected="${n++===resIdx}">${I.chat.replace("<svg",'<svg width="16" height="16"')}«${esc(inp.value)}»</a>`;
 box.innerHTML=html; box.hidden=false; inp.setAttribute("aria-expanded","true");
}
function pickResult(a){
 const inp=document.getElementById("gsearch"); document.getElementById("results").hidden=true;
 if(a.dataset.sup){S.pendingFilter=a.dataset.sup}
 if(a.dataset.askq){S.pendingAsk=a.dataset.askq}
 inp.value="";
 if(location.hash===a.getAttribute("href")) render(); else location.hash=a.getAttribute("href");
}

/* ---------- tendine personalizzate (sostituiscono le select native, che restano nascoste e sincronizzate) ---------- */
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></svg>';
let openSel=null;
function enhanceSelects(scope){
 scope.querySelectorAll("select.input:not([data-enh])").forEach(sel=>{
  sel.dataset.enh=1;
  const wrap=document.createElement("div"); wrap.className="sel";
  const btn=document.createElement("button"); btn.type="button"; btn.className="sel-btn";
  btn.setAttribute("aria-haspopup","listbox"); btn.setAttribute("aria-expanded","false");
  const lab=sel.id&&scope.querySelector(`label[for="${sel.id}"]`);
  if(lab){btn.id=sel.id+"-btn";lab.htmlFor=btn.id} else btn.setAttribute("aria-label",sel.getAttribute("aria-label")||"");
  const list=document.createElement("ul"); list.className="sel-list"; list.setAttribute("role","listbox"); list.hidden=true;
  sel.parentNode.insertBefore(wrap,sel); wrap.append(sel,btn,list);
  sel.classList.add("sr"); sel.tabIndex=-1; sel.setAttribute("aria-hidden","true");
  let act=sel.selectedIndex;
  const draw=()=>{
   btn.innerHTML=`<span>${esc(sel.options[sel.selectedIndex].text)}</span>${CHEV}`;
   wrap.classList.toggle("on",!!sel.value&&!wrap.closest(".form"));
   list.innerHTML=[...sel.options].map((o,i)=>`<li role="option" data-i="${i}" aria-selected="${i===sel.selectedIndex}" class="${i===act?"act":""}"><span class="ck">${I.check}</span>${esc(o.text)}</li>`).join("");
  };
  const open=()=>{if(openSel&&openSel!==close)openSel();act=sel.selectedIndex;list.hidden=false;btn.setAttribute("aria-expanded","true");draw();openSel=close};
  function close(){list.hidden=true;btn.setAttribute("aria-expanded","false");if(openSel===close)openSel=null}
  const pick=i=>{if(i!==sel.selectedIndex){sel.selectedIndex=i;sel.dispatchEvent(new Event("input",{bubbles:true}));sel.dispatchEvent(new Event("change",{bubbles:true}))}close();draw();btn.focus()};
  btn.onclick=()=>list.hidden?open():close();
  btn.onkeydown=e=>{
   const n=sel.options.length;
   if(["ArrowDown","ArrowUp"].includes(e.key)){e.preventDefault();e.stopPropagation();if(list.hidden)open();else{act=(act+(e.key==="ArrowDown"?1:-1)+n)%n;draw()}}
   else if((e.key==="Enter"||e.key===" ")&&!list.hidden){e.preventDefault();pick(act)}
   else if(e.key==="Escape"&&!list.hidden){e.preventDefault();e.stopPropagation();close()}
   else if(e.key==="Tab") close();
  };
  list.onmousedown=e=>{e.preventDefault();const li=e.target.closest("li");if(li)pick(+li.dataset.i)};
  list.onmousemove=e=>{const li=e.target.closest("li");if(li&&+li.dataset.i!==act){act=+li.dataset.i;list.querySelectorAll("li").forEach(x=>x.classList.toggle("act",+x.dataset.i===act))}};
  draw();
 });
}
document.addEventListener("mousedown",e=>{if(openSel&&!e.target.closest(".sel"))openSel()});

/* ---------- render e collegamenti ---------- */
function render(){
 const prev=render.last||"", now=(location.hash||"#").slice(1), fromDoc=prev.startsWith("doc-");
 if(now.startsWith("doc-")&&!fromDoc&&prev&&prev!=="login") S.from=prev;
 S.backTo=fromDoc&&!now.startsWith("doc-")?+prev.slice(4):null;
 document.body.classList.toggle("nonotes",!notes);
 const h=(location.hash||"#").slice(1);
 const root=document.getElementById("root");
 if(!S.loggedIn && h!=="login"){location.replace("#login");return}
 if(h==="login"){if(S.loggedIn){location.replace("#documenti");return}root.innerHTML=V.login();bindLogin();window.scrollTo(0,0);render.last=h;return}
 let name;
 if(h.startsWith("doc-")){root.innerHTML=V.doc(+h.slice(4))||V.gone();name="doc"}
 else{name=V[h]&&!["doc","gone","login"].includes(h)?h:"documenti";root.innerHTML=V[name]()}
 bind(name);
 enhanceSelects(root);
 if(render.last!==h){const y=fromDoc?S.scroll[h]:null;if(y!=null)requestAnimationFrame(()=>window.scrollTo(0,y));else window.scrollTo(0,0)}
 render.last=h;
 if(S.backTo!=null) setTimeout(()=>{S.backTo=null},50);
}
function bindLogin(){
 document.getElementById("loginForm").onsubmit=e=>{e.preventDefault();const v=document.getElementById("email").value.trim(),er=document.getElementById("loginErr");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){er.hidden=false;er.textContent="Controlla l'indirizzo email: manca qualcosa.";return}
  er.hidden=true;document.getElementById("sentTo").textContent=v;document.getElementById("sent").hidden=false};
 document.getElementById("fakeOpen").onclick=()=>{S.loggedIn=true;location.hash="documenti"};
 const toForm=()=>{const f=document.getElementById("loginForm");f.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>document.getElementById("email").focus({preventScroll:true}),350)};
 document.getElementById("topLogin").onclick=toForm; document.getElementById("endLogin").onclick=toForm;
 playStage(); document.getElementById("replay").onclick=playStage;
 document.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>{S.tryIdx=+b.dataset.try;document.querySelectorAll("[data-try]").forEach(x=>x.setAttribute("aria-pressed",x===b));document.getElementById("tryA").innerHTML=tryAnswer(false)});
}
function bind(h){
 document.getElementById("logout").onclick=()=>{S.loggedIn=false;location.hash="login"};
 const root=document.getElementById("root");
 const sw=document.getElementById("notesw"); sw.onchange=()=>{notes=sw.checked;document.body.classList.toggle("nonotes",!notes);try{localStorage.setItem("df-notes",notes?"1":"0")}catch(e){}};
 document.getElementById("helpk").onclick=shortcuts;
 const gs=document.getElementById("gsearch"), res=document.getElementById("results");
 gs.oninput=()=>{resIdx=0;drawResults()};
 gs.onfocus=drawResults;
 gs.onblur=()=>setTimeout(()=>res.hidden=true,150);
 gs.onkeydown=e=>{const opts=[...res.querySelectorAll("a")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();resIdx=(resIdx+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length;drawResults()}
  if(e.key==="Enter"&&opts[resIdx]){e.preventDefault();pickResult(opts[resIdx])}
  if(e.key==="Escape"){gs.value="";res.hidden=true;gs.blur()}};
 res.onmousedown=e=>{const a=e.target.closest("a");if(a){e.preventDefault();pickResult(a)}};

 // azioni delegate, valide in ogni vista
 root.onclick=e=>{
  const t=e.target.closest("[data-del],[data-retry],[data-dl],[data-edit],[data-verify],[data-upload],[data-go],[data-tab]"); if(!t) return;
  if(t.dataset.del) deleteDocs([+t.dataset.del]);
  else if(t.dataset.retry) retryDoc(+t.dataset.retry);
  else if(t.dataset.dl) download([+t.dataset.dl]);
  else if(t.dataset.edit) editFields(+t.dataset.edit);
  else if(t.dataset.verify) verifyDoc(+t.dataset.verify);
  else if(t.hasAttribute("data-upload")) document.getElementById("filein").click();
  else if(t.dataset.go){const g=t.dataset.go;
   if(g==="review"){S.onlyReview=true;location.hash="dati"}
   else if(g==="err"){S.docTab="err";render()}
   else {S.pendingSort=true;location.hash="dati"}}
  else if(t.dataset.tab!==undefined){S.docTab=t.dataset.tab;render()}
 };

 if(h==="documenti"){
  const drop=document.getElementById("drop");
  drop.onclick=e=>{if(!e.target.closest("a"))document.getElementById("filein").click()};
  drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();document.getElementById("filein").click()}};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")}; drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");const f=[...(e.dataTransfer.files||[])];addFiles(f.length?f:demoFiles())};
  root.querySelectorAll("[data-sel]").forEach(c=>c.onchange=()=>{const id=+c.dataset.sel;c.checked?S.sel.add(id):S.sel.delete(id);render()});
  const all=document.getElementById("selAll"); if(all) all.onchange=()=>{const vis=[...root.querySelectorAll("[data-sel]")].map(c=>+c.dataset.sel);vis.forEach(id=>all.checked?S.sel.add(id):S.sel.delete(id));render()};
  const bd=document.getElementById("bulkDel"); if(bd){bd.onclick=()=>deleteDocs([...S.sel]);document.getElementById("bulkDl").onclick=()=>download([...S.sel]);document.getElementById("bulkClear").onclick=()=>{S.sel.clear();render()}}
 }
 if(h==="dati"){
  const body=document.getElementById("dbody"), refresh=()=>{body.innerHTML=dataBody()};
  ["q","ftype","fsrc"].forEach(id=>{if(S.df[id])document.getElementById(id).value=S.df[id]});
  if(S.pendingFilter){document.getElementById("q").value=S.df.q=S.pendingFilter;S.pendingFilter=null}
  if(S.pendingSort){S.sortKey="due";S.sortDir=1;S.pendingSort=false}
  refresh();
  ["q","ftype","fsrc"].forEach(id=>{const el=document.getElementById(id);el.oninput=()=>{S.df[id]=el.value;refresh()}});
  document.getElementById("revchip").onclick=()=>{S.onlyReview=!S.onlyReview;refresh()};
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{const k=b.dataset.sort;S.sortDir=S.sortKey===k?-S.sortDir:1;S.sortKey=k;refresh()});
  body.addEventListener("click",e=>{if(e.target.id==="clearF"){S.df={};["q","ftype","fsrc"].forEach(id=>document.getElementById(id).value="");S.onlyReview=false;refresh()}});
  document.getElementById("csv").onclick=exportCsv;
 }
 if(h==="domande"){
  const chat=CHATS.find(c=>c.id===S.chatId)||CHATS[0];
  const draw=()=>{const m=document.getElementById("msgs");m.innerHTML=chat.msgs.map(msgHtml).join("");m.lastElementChild&&m.lastElementChild.scrollIntoView({block:"nearest"})};
  const ask=q=>{ if(!q.trim())return;
   if(!chat.msgs.length) chat.title=q.length>34?q.slice(0,32)+"…":q;
   chat.msgs.push({q}); chat.msgs.push({typing:true}); draw(); document.getElementById("qin").value="";
   setTimeout(()=>{chat.msgs.pop();const a=ANSWERS[q];chat.msgs.push(a?{...a}:{nf:true,a:"Non ho trovato la risposta nei documenti caricati. In questo mockup le risposte sono scritte a mano: prova una delle domande suggerite."});
    if(location.hash==="#domande") render()},900);
  };
  document.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>ask(b.dataset.ask));
  document.getElementById("ask").onsubmit=e=>{e.preventDefault();ask(document.getElementById("qin").value)};
  document.getElementById("newChat").onclick=()=>{const id=Math.max(...CHATS.map(c=>c.id))+1;CHATS.unshift({id,title:"Nuova conversazione",when:"Ora",msgs:[]});S.chatId=id;render();document.getElementById("qin").focus()};
  document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>{S.chatId=+b.dataset.chat;render()});
  document.getElementById("msgs").onclick=e=>{
   const c=e.target.closest("[data-copy]"), f=e.target.closest("[data-fb]");
   if(c){const m=chat.msgs[+c.dataset.copy];const txt=m.a.replace(/<[^>]+>/g,"");navigator.clipboard.writeText(txt).then(()=>toast("Risposta copiata")).catch(()=>toast("Copia non disponibile qui"))}
   if(f){const [i,v]=f.dataset.fb.split(":");const m=chat.msgs[+i];m.fb=m.fb===v?null:v;draw();if(m.fb)toast(v==="up"?"Grazie, segnalata come utile":"Grazie, la useremo per migliorare le risposte")}
  };
  if(S.pendingAsk){const q=S.pendingAsk;S.pendingAsk=null;ask(q)}
  else document.getElementById("msgs").lastElementChild?.scrollIntoView({block:"nearest"});
 }
 if(h==="attivita") root.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{S.logFilter=b.dataset.log;render()});
 if(h==="doc"){
  root.querySelectorAll("[data-hl]").forEach(dd=>{const k=dd.dataset.hl,m=root.querySelector(`mark[data-k="${k}"]`);if(!m)return;
   dd.onmouseenter=()=>m.classList.add("hl");dd.onmouseleave=()=>m.classList.remove("hl")});
  const re=document.getElementById("reext"); if(re) re.onclick=()=>reextract(+location.hash.slice(5));
  const ab=document.getElementById("askAbout"); if(ab) ab.onclick=()=>{S.chatId=1;const d=byId(+location.hash.slice(5));CHATS.unshift({id:99+S.uid++,title:d.supplier,when:"Ora",msgs:[]});S.chatId=CHATS[0].id};
 }
}

document.getElementById("filein").onchange=e=>{const f=[...e.target.files];e.target.value="";if(f.length){if(location.hash!=="#documenti")location.hash="documenti";addFiles(f)}};
let gPressed=0;
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&isOpen()){closeOverlay();return}
 if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||isOpen()||!S.loggedIn||e.metaKey||e.ctrlKey||e.altKey) return;
 if(e.key==="/"){e.preventDefault();document.getElementById("gsearch")?.focus()}
 else if(e.key==="?"){shortcuts()}
 else if(e.key==="u"||e.key==="U"){document.getElementById("filein").click()}
 else if(e.key==="g"){gPressed=Date.now()}
 else if(Date.now()-gPressed<900){const m={d:"documenti",e:"dati",q:"domande",a:"attivita"}[e.key];if(m){location.hash=m;gPressed=0}}
});
addEventListener("hashchange",()=>{const l=render.last;if(l&&!l.startsWith("doc-"))S.scroll[l]=window.scrollY;render()});
render();
</script>
