name: Database

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"

permissions:
  contents: read

jobs:
  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Starts only Postgres, applies every migration and the seed, then runs the
      # pgTAP tests in supabase/tests/ (tenant isolation, RLS policies).
      - run: npx supabase db start
      - run: npx supabase test db
